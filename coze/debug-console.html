<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>高血压专家Agent · 三套问卷对话流调试台</title>
<style>
:root{
  --teal:#1a7d82;--teal-dark:#0d4f52;--teal-light:#e0f4f5;
  --sage:#6ba584;--sage-light:#e8f4ec;
  --coral:#e07a5f;--coral-light:#fde8e3;
  --ink:#1a2b2c;--ink-2:#3d5456;--ink-3:#6b8082;--ink-4:#c4d2d3;
  --bg:#fbfaf7;--panel:#fff;--border:#ebe7df;
  --radius-lg:16px;--radius-md:10px;--radius-sm:6px;
  --shadow:0 6px 24px rgba(20,10,10,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;
}
.app{display:grid;grid-template-columns:1fr 380px;height:100vh;gap:16px;padding:16px}
.left-panel,.right-panel{
  background:var(--panel);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
}
.tabs{display:flex;border-bottom:1px solid var(--border);background:#fdfcf9;flex-shrink:0}
.tab{
  flex:1;padding:14px 12px;text-align:center;cursor:pointer;font-weight:600;color:var(--ink-3);
  border-bottom:3px solid transparent;transition:.2s;font-size:13px;
}
.tab.active{color:var(--teal-dark);border-color:var(--teal);background:var(--panel)}
.tab .badge{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--teal-light);color:var(--teal-dark);font-size:11px;margin-left:6px;line-height:20px}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#fbfaf7 0%,#f7faf6 100%)}
.msg{display:flex;gap:10px;max-width:85%}
.msg.ai{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:14px;color:#fff}
.msg.ai .avatar{background:linear-gradient(135deg,#1a7d82,#6ba584)}
.msg.user .avatar{background:linear-gradient(135deg,#e07a5f,#f2a89a)}
.bubble{padding:12px 16px;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg.ai .bubble{background:#fff;border:1px solid var(--border);border-top-left-radius:4px}
.msg.user .bubble{background:linear-gradient(135deg,#1a7d82,#14666a);color:#fff;border-top-right-radius:4px}
.bubble.options{display:flex;flex-direction:column;gap:6px;padding:10px 10px 14px;background:transparent;box-shadow:none;border:none}
.opt{
  padding:9px 14px;border-radius:10px;background:#fff;border:1px solid var(--border);cursor:pointer;
  transition:.15s;font-size:13px;color:var(--ink-2);text-align:left;width:100%;
}
.opt:hover{border-color:var(--teal);background:var(--teal-light);color:var(--teal-dark);transform:translateY(-1px)}
.opt.active{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);font-weight:600}
.input-group{padding:14px 16px;border-top:1px solid var(--border);background:#fff;display:flex;gap:10px;flex-shrink:0}
.input-group input,.input-group textarea{
  flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font:inherit;outline:none;resize:vertical;min-height:42px;
}
.input-group input:focus,.input-group textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light)}
.input-group .num-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.btn{
  padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,#1a7d82,#14666a);color:#fff;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;font-size:13px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,125,130,.25)}
.btn.ghost{background:#fff;color:var(--teal-dark);border:1px solid var(--teal-light)}
.btn.warn{background:linear-gradient(135deg,#e07a5f,#c26a53)}
.quick-actions{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap;flex-shrink:0}
.qa{padding:6px 12px;border-radius:20px;background:var(--sage-light);color:#2d5240;font-size:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.qa:hover{border-color:var(--sage);transform:translateY(-1px)}
.right-panel .header{
  padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;color:var(--teal-dark);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.right-panel .header .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--sage-light)}
.right-panel .body{flex:1;overflow-y:auto;padding:14px 18px}
.section{margin-bottom:22px}
.section-title{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:3px;height:12px;background:var(--teal);border-radius:2px}
.data-grid{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px}
.data-grid .k{color:var(--ink-3)}
.data-grid .v{color:var(--ink);font-weight:600;word-break:break-all}
.data-grid .v.bad{color:var(--coral)}
.data-grid .v.good{color:var(--sage)}
.risk-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.risk-low{background:#e8f4ec;color:#2d5240}
.risk-med{background:#fff3dc;color:#8a6d1f}
.risk-high{background:#fde8e3;color:#a5432a}
.risk-vhigh{background:#e5c8c8;color:#8a2020}
.report-card{background:linear-gradient(160deg,#fbfaf7,#e0f4f5);border-radius:12px;padding:16px;border:1px solid var(--teal-light)}
.report-card h4{margin:0 0 10px;color:var(--teal-dark);font-size:14px}
.report-card .row{padding:6px 0;border-bottom:1px dashed var(--ink-4);font-size:12.5px;display:flex;gap:8px}
.report-card .row:last-child{border-bottom:none}
.report-card .row b{flex-shrink:0;min-width:80px;color:var(--ink-2)}
.disclaimer{padding:10px 12px;background:#fff3dc;border-left:3px solid #d9a23c;border-radius:6px;font-size:11.5px;color:#6a5418;margin-top:8px}
.side-effect-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;font-size:12px}
.side-effect-card b{color:var(--teal-dark);font-size:12.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);font-size:11px;margin:2px 4px 2px 0}
.tag.active{background:var(--teal-light);border-color:var(--teal);color:var(--teal-dark);font-weight:600}
.symptom-match{background:#fde8e3;border:1px solid #f2a89a;border-radius:8px;padding:10px;font-size:12.5px;margin-top:8px}
.symptom-match b{color:var(--coral)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
@media(max-width:960px){.app{grid-template-columns:1fr;height:auto}.right-panel{max-height:450px}}
</style>
</head>
<body>
<div class="app">
  <div class="left-panel">
    <div class="tabs">
      <div class="tab active" data-tab="1">问卷一 · 初次分型评估 <span class="badge">25题</span></div>
      <div class="tab" data-tab="2">问卷二 · 用药情况采集 <span class="badge">4类</span></div>
      <div class="tab" data-tab="3">问卷三 · 日常康复+晚间评估 <span class="badge">6维</span></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="quick-actions" id="quickActions"></div>
    <div class="input-group" id="inputArea"></div>
  </div>
  <div class="right-panel">
    <div class="header"><span><span class="dot"></span>实时采集数据面板（调试用）</span><button class="btn ghost" style="padding:6px 12px;font-size:11px" onclick="resetAll()">重置全部</button></div>
    <div class="body" id="debugPanel">
      <div class="section">
        <div class="section-title">状态</div>
        <div class="data-grid">
          <div class="k">当前 Tab</div><div class="v" id="d_tab">问卷一</div>
          <div class="k">当前问题</div><div class="v" id="d_cursor">-</div>
          <div class="k">已采集数</div><div class="v" id="d_count">0</div>
        </div>
      </div>
      <div class="section" id="panelSec1">
        <div class="section-title">问卷一 · 基础与风险</div>
        <div class="data-grid" id="d_assess"></div>
      </div>
      <div class="section" id="reportSec" style="display:none">
        <div class="section-title">问卷一 · 7段式评估报告</div>
        <div class="report-card" id="d_report"></div>
      </div>
      <div class="section" id="panelSec2">
        <div class="section-title">问卷二 · 用药清单</div>
        <div id="d_med"></div>
      </div>
      <div class="section" id="panelSec3">
        <div class="section-title">问卷三 · 日常康复数据</div>
        <div class="data-grid" id="d_daily"></div>
      </div>
    </div>
  </div>
</div>
<script>
var state={tab:1,assess:{cursor:0,data:{},score:0,factors:[],bpGrade:'',bpGradeLv:0,subtype:'原发性高血压',riskLevel:'',report:null,complete:false},med:{drugs:[],other:'',health:'',tcm:'',adherence:''},daily:{bp:[],meds:[],symptoms:[],diet:[],exercise:[],sleepPsych:[],eveningQ:[]},tab3Mode:'free',eveningCursor:0};
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');state.tab=parseInt(t.dataset.tab);startTab();}});
function startTab(){
  document.getElementById('chat').innerHTML='';document.getElementById('quickActions').innerHTML='';document.getElementById('inputArea').innerHTML='';
  document.getElementById('panelSec1').style.display=state.tab==1?'block':'none';
  document.getElementById('reportSec').style.display='none';
  document.getElementById('panelSec2').style.display=state.tab==2?'block':'none';
  document.getElementById('panelSec3').style.display=state.tab==3?'block':'none';
  document.getElementById('d_tab').textContent='问卷'+['一','二','三'][state.tab-1];
  if(state.tab===1)startAssess();if(state.tab===2)startMed();if(state.tab===3)startDaily();renderPanel();
}
function aiMsg(html,opts){
  var wrap=document.createElement('div');wrap.className='msg ai';
  wrap.innerHTML='<div class="avatar">康</div><div class="bubble">'+html+'</div>';
  document.getElementById('chat').appendChild(wrap);
  if(opts&&opts.length){
    var optWrap=document.createElement('div');optWrap.className='msg ai';
    var bb='<div class="avatar" style="visibility:hidden">康</div><div class="bubble options">';
    opts.forEach(function(o){var label=typeof o==='string'?o:o.label;bb+='<button class="opt" onclick="'+(o.onclick||'void(0)')+'">'+label+'</button>';});
    bb+='</div>';optWrap.innerHTML=bb;document.getElementById('chat').appendChild(optWrap);
  }
  scrollBottom();
}
function userMsg(txt){var wrap=document.createElement('div');wrap.className='msg user';wrap.innerHTML='<div class="avatar">我</div><div class="bubble">'+txt+'</div>';document.getElementById('chat').appendChild(wrap);scrollBottom();}
function scrollBottom(){var c=document.getElementById('chat');setTimeout(function(){c.scrollTop=c.scrollHeight},50);}
function setInput(type,cb,placeholder){
  var area=document.getElementById('inputArea');area.innerHTML='';
  if(type==='text'){area.innerHTML='<input id="inp" placeholder="'+(placeholder||'请输入…')+'" /><button class="btn" id="btn">发送</button>';document.getElementById('btn').onclick=function(){var v=document.getElementById('inp').value.trim();if(!v)return;cb(v);};document.getElementById('inp').onkeydown=function(e){if(e.key==='Enter')document.getElementById('btn').click();};
  }else if(type==='num2'){area.innerHTML='<div class="num-row"><input id="i1" placeholder="'+(placeholder[0]||'')+'" type="number" /><input id="i2" placeholder="'+(placeholder[1]||'')+'" type="number" /></div><button class="btn" id="btn">下一步</button>';document.getElementById('btn').onclick=function(){cb(document.getElementById('i1').value.trim(),document.getElementById('i2').value.trim());};
  }else if(type==='txt2'){area.innerHTML='<div class="num-row"><input id="i1" placeholder="'+(placeholder[0]||'')+'" /><input id="i2" placeholder="'+(placeholder[1]||'')+'" /></div><button class="btn" id="btn">下一步</button>';document.getElementById('btn').onclick=function(){cb(document.getElementById('i1').value.trim(),document.getElementById('i2').value.trim());};
  }else if(type==='num'){area.innerHTML='<input id="inp" placeholder="'+(placeholder||'请输入数字')+'" type="number" /><button class="btn" id="btn">下一步</button>';document.getElementById('btn').onclick=function(){cb(document.getElementById('inp').value.trim())};
  }
}
function setQuick(list){var el=document.getElementById('quickActions');el.innerHTML='';list.forEach(function(it){var b=document.createElement('div');b.className='qa';b.textContent=it.label;b.onclick=it.onclick;el.appendChild(b);});}

// 问卷一
var QUESTIONS=[
  {id:'Q101',phase:'P1基础信息',title:'Q1. 请问您的性别是？',type:'opts',opts:[{label:'男',v:'male'},{label:'女',v:'female'}],store:function(v){state.assess.data.gender=v;}},
  {id:'Q102',phase:'P1基础信息',title:'Q2. 请问您的年龄是？（岁）',type:'num',ph:'例如 52',store:function(v){state.assess.data.age=parseInt(v)||0;var add=((state.assess.data.gender==='male'&&state.assess.data.age>55)||(state.assess.data.gender==='female'&&state.assess.data.age>65))?1:0;if(add)addFactor('年龄（男>55/女>65）',1);}},
  {id:'Q103',phase:'P1基础信息',title:'Q3. 请输入身高(cm)和体重(kg)，用于计算BMI',type:'num2',ph:['身高 172','体重 75'],store:function(h,w){h=parseFloat(h)||0;w=parseFloat(w)||0;state.assess.data.height=h;state.assess.data.weight=w;var bmi=h?(w/((h/100)*(h/100))):0;state.assess.data.bmi=Math.round(bmi*10)/10;if(bmi>=28)addFactor('肥胖(BMI≥28)',2);else if(bmi>=24)addFactor('超重(BMI 24-27.9)',1);}},
  {id:'Q104',phase:'P1基础信息',title:'Q4. 腰围约多少厘米？（判断腹型肥胖，不知道可跳过）',type:'num',ph:'例如 88（可跳过直接点下一步）',store:function(v){state.assess.data.waistline=parseFloat(v)||0;var w=state.assess.data.waistline;if(w&&((state.assess.data.gender==='male'&&w>=90)||(state.assess.data.gender==='female'&&w>=85)))addFactor('腹型肥胖（腰男≥90/女≥85）',1);},optional:true},
  {id:'Q105',phase:'P1基础信息',title:'Q5. 是否有高血压/心血管病家族史？（一级亲属）',type:'opts',opts:[{label:'有，且发病<50岁（早发）',v:'early',score:1,tag:'早发家族史'},{label:'有，但发病≥50岁',v:'family'},{label:'不清楚是否有',v:'unknown'},{label:'没有',v:'none'}],store:function(v,o){state.assess.data.family_history=v;if(o.score)addFactor('早发CVD家族史（<50岁）',o.score);}},
  {id:'Q201',phase:'P2血压分级',title:'Q6. 最近一次血压值？(SBP/DBP，mmHg)',type:'num2',ph:['收缩压 145','舒张压 92'],store:function(s,d){s=parseInt(s)||0;d=parseInt(d)||0;state.assess.data.sbp=s;state.assess.data.dbp=d;var gr='',lv=0,note='',subT='原发性高血压';if(s>=140&&d<90){gr='单纯收缩期高血压';lv=2;note='常见于老年，动脉硬化为主';subT='老年单纯收缩期高血压';}else if(s<140&&d>=90){gr='单纯舒张期高血压';lv=2;note='常见于中青年，肥胖/交感兴奋';subT='中青年单纯舒张期高血压';}else if(s>=180||d>=110){gr='3级高血压（重度）';lv=4;}else if(s>=160||d>=100){gr='2级高血压（中度）';lv=3;}else if(s>=140||d>=90){gr='1级高血压（轻度）';lv=2;}else if(s>=120||d>=80){gr='正常高值';lv=1;}else{gr='正常血压';lv=0;}state.assess.bpGrade=gr;state.assess.bpGradeLv=lv;state.assess.bpNote=note;state.assess.subtype=subT;}},
  {id:'Q202',phase:'P2血压分级',title:'Q7. 这个血压值是在哪里测量的？',type:'opts',opts:[{label:'医院/诊所（连续3次）',v:'clinic'},{label:'家庭自测（连续5-7天均值）',v:'home'},{label:'24小时动态血压',v:'abpm'},{label:'只测过1-2次，暂不确定',v:'occasional'}],store:function(v){state.assess.data.bp_place=v;}},
  {id:'Q203',phase:'P2血压分级',title:'Q8. 是否已确诊为高血压？',type:'opts',opts:[{label:'是，已确诊多年',v:'long',score:2},{label:'是，刚确诊不久',v:'new',score:2},{label:'还没确诊，但血压偏高',v:'suspected',score:1},{label:'没有，只是想了解预防',v:'healthy'}],store:function(v,o){state.assess.data.diagnosed=v;if(o.score)state.assess.score+=o.score;}},
  {id:'Q301',phase:'P3危险因素',title:'Q9. 您的吸烟情况？（含二手烟）',type:'opts',opts:[{label:'从不吸+很少二手烟',v:'never',s:0},{label:'已戒烟',v:'quit',s:0},{label:'常吸二手烟/偶尔吸烟',v:'sh',s:1,tag:'吸烟/二手烟'},{label:'每天<10支',v:'light',s:1,tag:'吸烟'},{label:'每天≥10支',v:'heavy',s:2,tag:'大量吸烟'}],store:function(v,o){state.assess.data.smoking=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s>=2?2:1);}}},
  {id:'Q302',phase:'P3危险因素',title:'Q10. 饮酒情况？',type:'opts',opts:[{label:'从不饮酒',v:'never',s:0},{label:'偶尔少量',v:'rare',s:0},{label:'每周1-2次中等量',v:'light',s:1,tag:'过量饮酒'},{label:'每周≥3次或每次大量',v:'heavy',s:2,tag:'大量饮酒'}],store:function(v,o){state.assess.data.alcohol=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s);}}},
  {id:'Q303',phase:'P3危险因素',title:'Q11. 日常饮食口味偏咸吗？（每天盐摄入）',type:'opts',opts:[{label:'很清淡<5g/天',v:'vl',s:0},{label:'清淡5-7g',v:'lo',s:0},{label:'适中7-10g',v:'mid',s:1,tag:'高盐饮食'},{label:'偏重10-15g',v:'hi',s:2,tag:'高盐饮食'},{label:'很咸>15g（腌制品多）',v:'vh',s:2,tag:'高盐饮食'}],store:function(v,o){state.assess.data.salt=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s);}}},
  {id:'Q304',phase:'P3危险因素',title:'Q12. 每周有氧运动情况？',type:'opts',opts:[{label:'几乎不运动',v:'none',s:2,tag:'缺乏运动'},{label:'每周1-2次<20min',v:'rare',s:1,tag:'缺乏运动'},{label:'每周3-4次20-30min',v:'mid',s:0},{label:'几乎每天≥30min',v:'freq',s:0}],store:function(v,o){state.assess.data.exercise=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s);}}},
  {id:'Q305',phase:'P3危险因素',title:'Q13. 蔬菜水果摄入情况？（富钾食物）',type:'opts',opts:[{label:'≥500g菜+≥200g果/天',v:'suf',s:0},{label:'300-500g菜+100-200g果',v:'mid',s:0},{label:'<300g菜+<100g果',v:'ins',s:1,tag:'蔬果摄入不足（低钾）'},{label:'几乎不吃',v:'rare',s:2,tag:'蔬果摄入严重不足'}],store:function(v,o){state.assess.data.fruitVeg=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s);}}},
  {id:'Q306',phase:'P3危险因素',title:'Q14. 静息心率大概是？（安静状态下，次/分）',type:'opts',opts:[{label:'<60次/分（偏慢）',v:'lo',s:0},{label:'60-80（正常）',v:'nm',s:0},{label:'80-100（偏快）',v:'hi',s:1,tag:'心率增快>80'},{label:'>100或不清楚',v:'vh',s:1,tag:'心率增快'}],store:function(v,o){state.assess.data.hr=v;if(o.s){state.assess.score+=o.s;if(o.tag)addFactor(o.tag,o.s);}}},

function askAssess(){

  if(q.type==='opts'){aiMsg(title,q.opts.map(function(o,i){return{label:o.label,onclick:'pickOpt('+state.assess.cursor+','+i+')'};}));
  }else if(q.type==='multi'){
    aiMsg(title+'<br><span style="color:var(--teal);font-size:12px">💡 多选：逐个点击添加，选完点击下面的确认按钮</span>');
    var div=document.createElement('div');div.className='msg ai';
    var html='<div class="avatar" style="visibility:hidden">康</div><div class="bubble options">';

    html+='<button class="btn" style="margin-top:6px;align-self:flex-end" onclick="confirmMulti('+state.assess.cursor+')">✅ 确认并继续</button>';
    if(q.optional)html+='<button class="btn ghost" style="margin-top:4px;align-self:flex-end" onclick="skipMulti('+state.assess.cursor+')">跳过此题</button>';
    html+='</div>';div.innerHTML=html;document.getElementById('chat').appendChild(div);scrollBottom();
  }else if(q.type==='num'){aiMsg(title);setInput('num',function(v){q.store(v);userMsg(v||'(跳过)');nextQ();renderPanel();},q.ph||'请输入数字');if(q.optional)setQuick([{label:'⏭️ 跳过此题',onclick:function(){q.store('');userMsg('(跳过)');nextQ();renderPanel();}}]);else setQuick([]);
  }else if(q.type==='num2'){aiMsg(title);setInput('num2',function(a,b){q.store(a,b);userMsg(a+' + '+b);nextQ();renderPanel();},q.ph||['数值1','数值2']);setQuick([]);
  }else if(q.type==='txt2'){aiMsg(title);setInput('txt2',function(a,b){q.store(a,b);userMsg(a+' / '+b);nextQ();renderPanel();},q.ph||['字段1','字段2']);setQuick([]);
  }else if(q.type==='text'){aiMsg(title);setInput('text',function(v){q.store(v);userMsg(v||'(跳过)');nextQ();renderPanel();},q.ph||'请输入文字');if(q.optional)setQuick([{label:'⏭️ 跳过此题',onclick:function(){q.store('');userMsg('(跳过)');nextQ();renderPanel();}}]);else setQuick([]);

function confirmMulti(qi){

function finishAssess(){
  var lv=state.assess.bpGradeLv;var nFact=state.assess.factors.length;
  var hmod=!!state.assess.hasHMOD||!!state.assess.hasCKD3;var comp=!!state.assess.hasComplications||!!state.assess.hasDMComp;var dm=!!state.assess.hasDiabetes;
  var level='低危',key='low';
  function pick(c0,c12,c3,cc){if(comp)return cc;if(nFact>=3||hmod||dm)return c3;if(nFact>=1&&nFact<=2)return c12;return c0;}
  if(lv>=4)level=pick('高危','很高危','很高危','很高危');
  else if(lv===3){level=pick('中危','中-高危','高危','很高危');if(level==='中-高危')level='高危';}
  else if(lv===2)level=pick('低危','中危','高危','很高危');
  else if(lv===1){level=pick('低危','低危','中-高危','高-很高危');if(level==='中-高危')level='中危';if(level==='高-很高危')level='高危';}
  else level=(comp||hmod)?'高危':(nFact>=3?'中危':'低危');
  if(comp)level='很高危';
  if(level==='很高危')key='vhigh';else if(level==='高危')key='high';else if(level==='中危')key='med';else key='low';
  state.assess.riskLevel=level;state.assess.riskKey=key;
  var bpRange=state.assess.data.sbp+'/'+state.assess.data.dbp+' mmHg';
  var timing='',target='';
  if(key==='vhigh'||key==='high'){timing='立即启动降压药物治疗（I类推荐，A级证据）；同时强化生活方式干预。';target='一般<140/90，能耐受者<130/80；4-12周内达标。';}
  else if(key==='med'){timing='先进行4~12周严格的生活方式干预；如血压仍≥140/90mmHg则尽早启动药物治疗（I类推荐）。';target='<140/90；能耐受者可<130/80。';}
  else{timing='无需立即启动药物治疗，但必须持续进行生活方式干预（I类推荐）。';target='<130/80；每3-6个月复测血压。';}
  var factorList=state.assess.factors.length?state.assess.factors.map(function(x){return '⚠️ '+x.name}).join('<br>'):'✅ 无明确心血管危险因素';
  var hmodList=state.assess.data.hmod&&state.assess.data.hmod!=='none'?state.assess.data.hmod:'✅ 未见明确靶器官损害';
  var compList=state.assess.data.comps&&state.assess.data.comps!=='none'?state.assess.data.comps:'✅ 无临床并发症病史';
  state.assess.report='<h4>📋 高血压个体化评估报告</h4>'+
  '<div class="row"><b>① 血压分级：</b>'+state.assess.bpGrade+'（'+bpRange+'）'+(state.assess.bpNote||'')+'</div>'+
  '<div class="row"><b>② 分型提示：</b>'+state.assess.subtype+'</div>'+
  '<div class="row"><b>③ 危险因素：</b>'+factorList+'</div>'+
  '<div class="row"><b>④ HMOD/并发症：</b>靶器官损害：'+hmodList+'<br>&nbsp;&nbsp;&nbsp;并发症：'+compList+'<br>&nbsp;&nbsp;&nbsp;继发性线索：'+(state.assess.data.secondary||'无')+'</div>'+
  '<div class="row"><b>⑤ 危险分层：</b><span class="risk-tag risk-'+key+'">'+level+'</span>（10年心血管事件绝对风险：'+riskRange(key)+'）</div>'+
  '<div class="row"><b>⑥ 治疗时机+目标：</b>'+timing+'<br>控制目标：'+target+'</div>'+
  '<div class="row"><b>⑦ 下一步行动：</b>1️⃣ 建议尽快到心内科/高血压专科就诊（很高危/高危立即）；<br>2️⃣ 生活方式重点突破：<b>减盐(<5g)+每周≥150min有氧+减重(如BMI≥24)+富钾蔬果</b>；<br>3️⃣ 开始早晚家庭自测血压，带记录本就诊</div>'+
  '<div class="disclaimer">⚠️ 本报告依据《中国高血压防治指南2024》和您输入数据生成，仅供健康管理参考，不替代医师诊断/处方。血压≥180/110+头痛/胸痛/肢体麻木/言语不清请立即急诊就医。</div>';
  state.assess.complete=true;document.getElementById('d_cursor').textContent='已完成 ✓';

  setTimeout(function(){

function addSample(k,text,label){userMsg(text);var item={time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),text:text,tag:label};state.daily[k].push(item);
  if(k==='bp'){var m=text.match(/(\d{2,3})[/:_\s-]+(\d{2,3})/);var hr=text.match(/心率\s*(\d+)/);item.parsed=m?('SBP '+m[1]+' / DBP '+m[2]+(hr?' / HR '+hr[1]:'')):'';if(m&&(parseInt(m[1])>=180||parseInt(m[2])>=110)){aiMsg('<div style="color:#8a2020"><b>⚠️ 紧急提醒：血压≥180/110mmHg（3级）！</b><br>请立即静坐休息10分钟复测；若仍高+头痛/胸痛/肢体麻木/言语不清，立即拨打120或急诊。</div>');}else{aiMsg('✅ 已记录'+label+'血压数据：'+item.parsed+'<br><br><b>解读：</b>家庭血压≥135/85=未达标；<130/80=达标良好');}}else if(k==='symptoms'){var map={'头晕':{c:['血压波动/体位性低血压/CCB副作用/睡眠差'],a:['先测血压','起身坐30秒站30秒再走','CCB水肿头痛可调药']},'心慌':{c:['心率快/早搏/房颤/血压低/甲亢/短效CCB反射性心率快'],a:['立即测血压+数脉搏1分钟','心率>100不缓解伴胸痛→就医','试试4-4-6呼吸法']},'干咳':{c:['ACEI类药物干咳(10-20%)/感冒/过敏'],a:['如服普利类+无感染→就医换ARB类','含润喉糖+多喝水']},'水肿':{c:['CCB类常见副作用/心/肾功能不全/静脉回流差'],a:['抬高下肢+弹力袜+联用ACEI/ARB可缓解','单侧突发肿→排除血栓']},'失眠':{c:['夜间血压未控制/焦虑/OSA/睡前咖啡/屏幕/β阻滞剂少数人失眠'],a:['睡前测血压','严重打鼾→筛查睡眠呼吸暂停OSA']}};var html='';Object.keys(map).forEach(function(k2){if(text.indexOf(k2)>=0){var d=map[k2];html+='<div class="symptom-match"><b>'+k2+' 可能原因 Top3：</b><br>• '+d.c.join('<br>• ')+'<br><br><b>✅ 立即可做的3条：</b><br>• '+d.a.join('<br>• ')+'</div>';}});aiMsg('🩺 【症状映射库自动匹配结果】<br>'+html);}else if(k==='diet'){aiMsg('✅ 已记录'+label+'饮食反馈<br>⚠️ <b>风险提示：</b>酸菜鱼汤底约含盐15-20g/份；3瓶啤酒≈酒精60g>推荐上限15g/日<br>📅 明日调整建议：① 中午替换为清蒸/清炒菜；② 加大饮水量1500ml+富钾水果；③ 监测次日晨起血压');}else{aiMsg('✅ 已记录'+label+'：'+text);}renderPanel();}
function showSymptomMap(){var html='<b>📖 症状映射匹配库（T8）</b><br>用户随便说，AI自动识别→Top3可能原因→3条可操作建议';var map={'头晕/眩晕':['血压波动（过高或过低）、体位性低血压、CCB副作用、睡眠差','先测血压；起身慢三步（坐30s→站30s→走）；CCB水肿头痛可调药'],'心慌/心悸':['心率快（交感兴奋）、早搏/房颤、血压低、甲亢、短效CCB反射性心率快','测血压+数脉搏1分钟；心率>100持续不缓解或伴胸痛→就医；4-4-6呼吸法'],'干咳':['ACEI类药物干咳(10-20%)、感冒/过敏','如服普利类+无感染→就医换ARB；含润喉糖+多喝水'],'脚踝水肿':['CCB地平类常见副作用、心功能不全、肾功能不全、静脉回流差','抬高下肢+联用ACEI/ARB；单侧突发肿→排除血栓'],'失眠':['血压未控制(夜间高)、焦虑压力、打鼾/OSA、睡前咖啡/屏幕、β阻滞剂少数人失眠','睡前测血压；严重打鼾→查睡眠监测；建立90分钟睡眠仪式']};Object.keys(map).forEach(function(k){html+='<div class="symptom-match"><b>'+k+'</b><br><b>🔍 可能原因：</b>'+map[k][0]+'<br><b>✅ 建议：</b>'+map[k][1]+'</div>';});aiMsg(html);}

function renderPanel(){
  var a=state.assess;var d=a.data;
  var rows1=[['性别',d.gender||'-'],['年龄',d.age?d.age+' 岁':'-'],['身高/体重/BMI',(d.height&&d.weight?d.height+'cm/'+d.weight+'kg / BMI '+d.bmi:'-')],['腰围',d.waistline?d.waistline+'cm':'-'],['早发家族史',d.family_history||'-'],['血压值',d.sbp?d.sbp+'/'+d.dbp+' mmHg':'-'],['血压分级',a.bpGrade||'-'],['高血压分型',a.subtype||'-'],['测量场景',d.bp_place||'-'],['是否确诊',d.diagnosed||'-'],['心血管危险因素',a.factors.length?a.factors.length+' 项：<br>• '+a.factors.map(function(x){return x.name+'(+'+x.score+')'}).join('<br>• '):'无'],['累计分值+并发症','分 '+a.score+'；HMOD：'+(a.hasHMOD?'✅':'❌')+'；并发症：'+(a.hasComplications?'✅':'❌')+'；DM：'+(a.hasDiabetes?'✅':'❌')],['心血管危险分层',a.riskLevel?'<span class="risk-tag risk-'+a.riskKey+'">'+a.riskLevel+'</span>（10年风险 '+riskRange(a.riskKey)+'）':'-'],['用药依从性',d.adhLv!=null?('⭐'.repeat(d.adhLv)+'☆'.repeat(3-d.adhLv)):'-'],['作息（起床/睡觉）',d.wake?(d.wake+' / '+d.sleep_time):'-'],['饮食偏好',d.dietPref||'-'],['运动偏好',d.exPref||'-']];
  document.getElementById('d_assess').innerHTML=rows1.map(function(r){return '<div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div>';}).join('');
  document.getElementById('d_count').textContent=Object.keys(d).filter(function(x){return d[x]!==undefined&&d[x]!==''&&d[x]!==null}).length+' 个变量';
  if(a.report)document.getElementById('d_report').innerHTML=a.report;else document.getElementById('d_report').innerHTML='<div style="color:var(--ink-3);font-size:12px">完成评估后这里将展示完整7段式报告 ⬆️</div>';
  var html2='';
  if(state.med.drugs.length){state.med.drugs.forEach(function(d,i){html2+='<div class="side-effect-card"><b>💊 #'+(i+1)+' '+d.name+'</b> <span class="tag'+(d.class?' active':'')+'">'+(d.cls||'未识别类别')+'</span><br>剂量：'+d.dosage+' · 频率：'+d.freq+' · 时间：'+d.time+'<br>漏服：'+d.missed+' · 副作用：'+d.side+'</div>';});}else html2+='<div style="color:var(--ink-3);font-size:12px">暂无降压药记录，请在左侧 Tab2 添加 ⬆️</div>';
  ['other','health','tcm'].forEach(function(k){var label={other:'📋 其他合并用药',health:'🧴 保健品/补剂',tcm:'🌿 中药/中成药'}[k];if(state.med[k])html2+='<div class="side-effect-card"><b>'+label+'</b><br>'+state.med[k]+'</div>';});
  document.getElementById('d_med').innerHTML=html2;
  function countLabel(arr){return arr.length?('<span class="tag active">'+arr.length+'条</span>'):'<span style="color:var(--ink-3)">0条</span>';}
  var rows3=[['血压记录',countLabel(state.daily.bp)+'<br>'+state.daily.bp.map(function(x){return '• '+x.time+' '+x.parsed+'<br>'}).join('')],['用药执行',countLabel(state.daily.meds)+'<br>'+state.daily.meds.map(function(x){return '• '+x.time+' '+x.text+'<br>'}).join('')],['症状感受',countLabel(state.daily.symptoms)+'<br>'+state.daily.symptoms.map(function(x){return '• '+x.time+' '+x.text+'<br>'}).join('')],['饮食情况',countLabel(state.daily.diet)+'<br>'+state.daily.diet.map(function(x){return '• '+x.time+' '+x.text+'<br>'}).join('')],['运动情况',countLabel(state.daily.exercise)+'<br>'+state.daily.exercise.map(function(x){return '• '+x.time+' '+x.text+'<br>'}).join('')],['睡眠+心理',countLabel(state.daily.sleepPsych)+'<br>'+state.daily.sleepPsych.map(function(x){return '• '+x.time+' '+x.text+'<br>'}).join('')],['晚间评估7问',state.daily.eveningQ.length?('<span class="tag active">'+state.daily.eveningQ.length+'/7 已完成</span>'):'<span style="color:var(--ink-3)">未开始</span>']];
  document.getElementById('d_daily').innerHTML=rows3.map(function(r){return '<div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div>'}).join('');
}
function resetAll(){state={tab:1,assess:{cursor:0,data:{},score:0,factors:[],bpGrade:'',bpGradeLv:0,subtype:'原发性高血压',riskLevel:'',report:null,complete:false},med:{drugs:[],other:'',health:'',tcm:'',adherence:''},daily:{bp:[],meds:[],symptoms:[],diet:[],exercise:[],sleepPsych:[],eveningQ:[]},tab3Mode:'free',eveningCursor:0};document.querySelector('.tab[data-tab="1"]').click();renderPanel();}
startTab();
</script>
</body>
</html>
