<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>血压健康管理 · AI助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-900: #0d4f52;
    --teal-800: #14666a;
    --teal-700: #1a7d82;
    --teal-500: #2da5aa;
    --teal-300: #7dc8cc;
    --teal-100: #e0f4f5;
    --sage-500: #6ba584;
    --sage-300: #b5d8c3;
    --sage-100: #e8f4ec;
    --coral-500: #e07a5f;
    --coral-300: #f2a89a;
    --coral-100: #fde8e3;
    --warm-50: #fbfaf7;
    --warm-100: #f5f3ee;
    --warm-200: #ebe7df;
    --ink-900: #1a2b2c;
    --ink-700: #3d5456;
    --ink-500: #6b8082;
    --ink-400: #94a8aa;
    --ink-300: #c4d2d3;
    --shadow-sm: 0 2px 8px rgba(20,10,10,0.06);
    --shadow-md: 0 6px 24px rgba(20,10,10,0.08);
    --shadow-lg: 0 12px 40px rgba(20,10,10,0.12);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    --font-sans: 'Manrope', -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    font-family: var(--font-sans);
    background: var(--warm-50);
    color: var(--ink-900);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: 
      radial-gradient(ellipse at 10% 0%, rgba(125,200,204,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 100%, rgba(107,165,132,0.14) 0%, transparent 45%),
      var(--warm-50);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ─────── Header ─────── */
  .header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(251,250,247,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(20,10,10,0.05);
    z-index: 10;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-700), var(--sage-500));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px;
    box-shadow: 0 4px 12px rgba(20,125,130,0.35);
    position: relative;
  }
  .avatar::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 12px; height: 12px;
    background: #4ade80;
    border-radius: 50%;
    border: 2px solid var(--warm-50);
  }
  .header-info h1 {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    color: var(--ink-900);
    letter-spacing: 0.02em;
  }
  .header-info .status {
    font-size: 12px;
    color: var(--ink-500);
    display: flex; align-items: center; gap: 4px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--warm-100);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--ink-700);
  }
  .icon-btn:active { transform: scale(0.92); background: var(--warm-200); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.active { background: var(--teal-100); color: var(--teal-700); }

  /* ─────── Voice Picker ─────── */
  .voice-picker {
    display: none;
    padding: 14px 16px 16px;
    background: var(--warm-50);
    border-bottom: 1px solid var(--warm-200);
    animation: slideDown 0.25s ease;
  }
  .voice-picker.show { display: block; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .voice-picker-title {
    font-size: 12px;
    color: var(--ink-500);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .voice-options {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .voice-options::-webkit-scrollbar { display: none; }
  .voice-chip {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: var(--radius-xl);
    background: #fff;
    border: 1.5px solid var(--warm-200);
    font-size: 13px;
    color: var(--ink-700);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-family: var(--font-sans);
  }
  .voice-chip:active { transform: scale(0.95); }
  .voice-chip.selected {
    background: var(--teal-700);
    border-color: var(--teal-700);
    color: #fff;
    box-shadow: var(--shadow-sm);
  }

  /* ─────── Chat Area ─────── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 20px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { display: none; }

  .msg-group {
    margin-bottom: 16px;
    animation: fadeUp 0.4s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .msg.bot { flex-direction: row; }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, var(--teal-700), var(--sage-500));
    color: white;
  }
  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--coral-500), var(--coral-300));
    color: white;
  }

  .bubble-wrap { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user .bubble-wrap { align-items: flex-end; }
  .msg.bot .bubble-wrap { align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }
  .msg.bot .bubble {
    background: white;
    color: var(--ink-900);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
    color: white;
    border-bottom-right-radius: 6px;
  }

  .bubble-time {
    font-size: 11px;
    color: var(--ink-400);
    padding: 0 4px;
  }

  /* Bot typing indicator */
  .typing .bubble {
    padding: 14px 18px;
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--ink-400);
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Voice indicator on bot bubble */
  .voice-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 4px 8px;
    background: var(--teal-100);
    border-radius: 99px;
    font-size: 11px;
    color: var(--teal-800);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .voice-indicator:hover { background: var(--teal-300); color: white; }
  .voice-bar { display: flex; gap: 2px; align-items: center; }
  .voice-bar span {
    display: block;
    width: 2px;
    height: 8px;
    background: currentColor;
    border-radius: 1px;
    animation: voiceBar 0.8s ease-in-out infinite;
  }
  .voice-bar span:nth-child(2) { animation-delay: 0.1s; height: 12px; }
  .voice-bar span:nth-child(3) { animation-delay: 0.2s; height: 6px; }
  @keyframes voiceBar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* ─────── Quick Reply Chips ─────── */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding-left: 42px;
  }
  .quick-chip {
    padding: 8px 16px;
    border-radius: 99px;
    background: white;
    border: 1.5px solid var(--teal-300);
    color: var(--teal-800);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .quick-chip:active {
    transform: scale(0.95);
    background: var(--teal-700);
    color: white;
    border-color: var(--teal-700);
  }
  .quick-chip.primary {
    background: var(--teal-700);
    color: white;
    border-color: var(--teal-700);
  }
  .quick-chip.secondary {
    background: var(--sage-100);
    color: var(--sage-500);
    border-color: var(--sage-300);
  }

  /* ─────── Input Area ─────── */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px 20px;
    background: rgba(251,250,247,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(20,10,10,0.06);
  }
  .voice-capture {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: white;
    border-radius: 99px;
    box-shadow: var(--shadow-md);
    border: 1.5px solid transparent;
    transition: all 0.3s ease;
    position: relative;
  }
  .voice-capture.listening {
    border-color: var(--coral-500);
    background: var(--coral-100);
  }
  .voice-capture.listening::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 99px;
    border: 2px solid var(--coral-300);
    animation: ringPulse 1.5s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.1); opacity: 0; }
  }
  .text-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink-900);
    min-width: 0;
  }
  .text-input::placeholder { color: var(--ink-400); }
  .mic-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--coral-500), var(--coral-300));
    border: none;
    color: white;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(224,122,95,0.35);
  }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn.active {
    background: linear-gradient(135deg, var(--coral-500), #c95a40);
    animation: micPulse 1.5s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(224,122,95,0.35); }
    50% { box-shadow: 0 4px 24px rgba(224,122,95,0.6); }
  }
  .mic-btn svg { width: 20px; height: 20px; }
  .voice-hint {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink-900);
    color: white;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .voice-hint.show { opacity: 1; }

  /* ─────── Timeline Card ─────── */
  .timeline-card {
    margin: 12px 0 8px;
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .timeline-header {
    padding: 16px 18px 12px;
    background: linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .timeline-header h3 {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .timeline-header p {
    font-size: 12px;
    opacity: 0.85;
  }
  .timeline-badge {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .day-tabs {
    display: flex;
    padding: 12px 12px 0;
    gap: 6px;
    border-bottom: 1px solid var(--warm-200);
  }
  .day-tab {
    flex: 1;
    padding: 8px 6px;
    border-radius: 12px 12px 0 0;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    background: var(--warm-100);
    border: none;
    font-family: var(--font-sans);
    position: relative;
  }
  .day-tab .day-label {
    font-size: 11px;
    color: var(--ink-500);
    margin-bottom: 2px;
  }
  .day-tab .day-date {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-700);
  }
  .day-tab.active {
    background: white;
    box-shadow: 0 -2px 8px rgba(20,10,10,0.04);
  }
  .day-tab.active .day-label { color: var(--teal-700); }
  .day-tab.active .day-date { color: var(--teal-800); }
  .day-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--teal-700);
    border-radius: 1px;
  }

  .timeline-body {
    padding: 12px 14px 16px;
    max-height: 320px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .timeline-body::-webkit-scrollbar { display: none; }

  .tl-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    position: relative;
    animation: itemIn 0.4s ease both;
  }
  .tl-item-content { animation-delay: 0.05s; }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .tl-time-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 48px;
    flex-shrink: 0;
  }
  .tl-time {
    font-size: 13px;
    font-weight: 700;
    color: var(--teal-800);
    font-variant-numeric: tabular-nums;
  }
  .tl-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin: 6px 0 2px;
    flex-shrink: 0;
    position: relative;
  }
  .tl-dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0.25;
  }
  .tl-line {
    width: 2px;
    flex: 1;
    min-height: 18px;
    background: var(--warm-200);
  }
  .tl-item:last-child .tl-line { display: none; }

  .tl-content {
    flex: 1;
    padding: 8px 12px;
    background: var(--warm-100);
    border-radius: var(--radius-md);
    border: 1px solid rgba(20,10,10,0.04);
    transition: all 0.2s ease;
  }
  .tl-content:active { transform: scale(0.98); }
  .tl-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .tl-icon {
    width: 22px; height: 22px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .tl-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-900);
  }
  .tl-desc {
    font-size: 12.5px;
    color: var(--ink-500);
    line-height: 1.5;
  }
  .tl-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 500;
  }

  /* Category colors */
  .cat-medication .tl-dot { background: var(--coral-500); color: var(--coral-500); }
  .cat-medication .tl-icon { background: var(--coral-100); }
  .cat-medication .tl-tag { background: var(--coral-100); color: var(--coral-500); }

  .cat-monitor .tl-dot { background: var(--teal-700); color: var(--teal-700); }
  .cat-monitor .tl-icon { background: var(--teal-100); }
  .cat-monitor .tl-tag { background: var(--teal-100); color: var(--teal-800); }

  .cat-exercise .tl-dot { background: var(--sage-500); color: var(--sage-500); }
  .cat-exercise .tl-icon { background: var(--sage-100); }
  .cat-exercise .tl-tag { background: var(--sage-100); color: var(--sage-500); }

  .cat-nutrition .tl-dot { background: #d4a843; color: #d4a843; }
  .cat-nutrition .tl-icon { background: #fdf5dc; }
  .cat-nutrition .tl-tag { background: #fdf5dc; color: #a07d20; }

  .cat-psychology .tl-dot { background: #9b7bbf; color: #9b7bbf; }
  .cat-psychology .tl-icon { background: #efe6f7; }
  .cat-psychology .tl-tag { background: #efe6f7; color: #7a569b; }

  .cat-sleep .tl-dot { background: #4a6fa5; color: #4a6fa5; }
  .cat-sleep .tl-icon { background: #e0e8f5; }
  .cat-sleep .tl-tag { background: #e0e8f5; color: #3a5885; }

  .cat-assessment .tl-dot { background: #e8a54a; color: #e8a54a; }
  .cat-assessment .tl-icon { background: #fef0dc; }
  .cat-assessment .tl-tag { background: #fef0dc; color: #c08330; }

  /* ─────── Welcome Screen ─────── */
  .welcome {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, var(--teal-800) 0%, var(--teal-700) 40%, var(--sage-500) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    z-index: 100;
    transition: opacity 0.5s ease, transform 0.6s ease;
  }
  .welcome.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }
  .welcome-logo {
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.15);
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .welcome-logo svg { width: 44px; height: 44px; color: white; }
  .welcome h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    color: white;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .welcome p {
    color: rgba(255,255,255,0.8);
    font-size: 15px;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 36px;
    max-width: 280px;
  }
  .welcome-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    background: white;
    color: var(--teal-800);
    border: none;
    border-radius: 99px;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,0.2);
    transition: all 0.25s ease;
  }
  .welcome-btn:active { transform: scale(0.96); }
  .welcome-btn svg { width: 18px; height: 18px; }
  .welcome-tip {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
  }

  /* ─────── Fade animations ─────── */
  .fade-in { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ─────── Scrollbar for webkit ─────── */

/* ═════════════════════════════════════════════
   Speech Synthesis
   ═════════════════════════════════════════════ */
function cleanTextForSpeech(text) {
  return text
    .replace(/\*\*/g, '')
    .replace(/[•·▪◆●○■□]/g, '。')
    .replace(/[📚📖💊🩺🥣🥗🍲🧘🚶🌱🌙📋📊🏊🏃🕉️🍵🍱🥐🥘😴💪👏💯🔥⭐⚠️✅❌➕➡️]/gu, '')
    .replace(/(\d+)\./g, '$1，')
    .replace(/[；;]/g, '。')
    .replace(/\n{2,}/g, '。')
    .replace(/\n/g, '。')
    .replace(/[，。][，。]+/g, '。')
    .replace(/\s+/g, ' ')
    .trim();
}

function splitSentences(text) {
  return text
    .split(/(?<=[。！？!?])/)
    .map(s => s.trim())
    .filter(Boolean);
}

/* ── Edge Neural TTS ───────────────────────── */
const EDGE_TTS = {
  token: '6A5AA1D4EAFF4E9FB37E23D68491D6F4',
  get wss() {
    return 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1'
      + '?TrustedClientToken=' + this.token;
  },
  voices: {
    xiaoxiao: { name: 'zh-CN-XiaoxiaoNeural', label: '晓晓 · 温柔女声', style: 'gentle' },
    xiaoyi:   { name: 'zh-CN-XiaoyiNeural',   label: '晓伊 · 亲切女声', style: 'gentle' },
    yunxi:    { name: 'zh-CN-YunxiNeural',    label: '云希 · 阳光男声', style: 'friendly' },
    yunyang:  { name: 'zh-CN-YunyangNeural',  label: '云扬 · 沉稳男声', style: 'friendly' },
    yunxia:   { name: 'zh-CN-YunxiaNeural',   label: '云夏 · 活泼少年', style: 'cheerful' }
  },
  current: 'xiaoxiao',
  available: true
};

function escapeXml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function buildSSML(text, voiceKey) {
  const v = EDGE_TTS.voices[voiceKey] || EDGE_TTS.voices.xiaoxiao;
  const sentences = splitSentences(text);
  const body = sentences.map(s => {
    const isQ = /[？?]$/.test(s);
    const pause = s.length <= 10 ? '180ms' : '320ms';
    return '<s>' + (isQ ? '<prosody pitch="+6%">' : '')
      + escapeXml(s) + (isQ ? '</prosody>' : '')
      + '</s><break time="' + pause + '"/>';
  }).join('');
  return '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" '
    + 'xmlns:mstts="https://www.w3.org/2001/mstts" xml:lang="zh-CN">'
    + '<voice name="' + v.name + '">'
    + '<mstts:express-as style="' + v.style + '" styledegree="1.1">'
    + '<prosody rate="-4%" pitch="+2%" volume="+0%">'
    + body
    + '</prosody></mstts:express-as></voice></speak>';
}

function edgeConnectId() {
  let s = '';
  for (let i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s;
}

function synthViaEdge(text, voiceKey) {
  return new Promise((resolve, reject) => {
    let ws;
    try {
      ws = new WebSocket(EDGE_TTS.wss + '&ConnectionId=' + edgeConnectId());
    } catch (e) { return reject(e); }
    ws.binaryType = 'arraybuffer';
    const chunks = [];
    const timer = setTimeout(() => { try { ws.close(); } catch (e) {} reject(new Error('timeout')); }, 12000);

    ws.onopen = () => {
      const ts = new Date().toString();
      ws.send('X-Timestamp:' + ts + '\r\nContent-Type:application/json; charset=utf-8\r\n'
        + 'Path:speech.config\r\n\r\n'
        + '{"context":{"synthesis":{"audio":{"metadataoptions":{'
        + '"sentenceBoundaryEnabled":false,"wordBoundaryEnabled":false},'
        + '"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}');
      ws.send('X-RequestId:' + edgeConnectId() + '\r\nContent-Type:application/ssml+xml\r\n'
        + 'X-Timestamp:' + ts + 'Z\r\nPath:ssml\r\n\r\n' + buildSSML(text, voiceKey));
    };

    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        if (ev.data.includes('Path:turn.end')) {
          clearTimeout(timer);
          try { ws.close(); } catch (e) {}
          if (!chunks.length) return reject(new Error('no audio'));
          resolve(new Blob(chunks, { type: 'audio/mpeg' }));
        }
        return;
      }
      const bytes = new Uint8Array(ev.data);
      const header = new TextDecoder().decode(bytes.slice(0, Math.min(1024, bytes.length)));
      const marker = header.indexOf('Path:audio\r\n');
      if (marker !== -1) chunks.push(bytes.slice(marker + 12));
    };

    ws.onerror = () => { clearTimeout(timer); reject(new Error('ws error')); };
    ws.onclose = () => clearTimeout(timer);
  });
}

/* ── Playback controller ───────────────────── */
let ttsSession = 0;
let currentAudio = null;

async function speakText(text) {
  if (!state.speechOn) return;
  stopSpeaking();
  const session = ++ttsSession;
  const cleaned = cleanTextForSpeech(text);
  if (!cleaned) return;

  if (EDGE_TTS.available) {
    try {
      const blob = await synthViaEdge(cleaned, EDGE_TTS.current);
      if (session !== ttsSession) return;
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      currentAudio = audio;
      audio.onended = audio.onerror = () => URL.revokeObjectURL(url);
      await audio.play();
      return;
    } catch (e) {
      EDGE_TTS.available = false;
      if (session !== ttsSession) return;
    }
  }
  speakViaWebSpeech(cleaned, session);
}

/* ── Fallback: Web Speech API ──────────────── */
function pickZhVoice() {
  const voices = state.synth ? state.synth.getVoices() : [];
  const zh = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  if (!zh.length) return null;
  const natural = zh.find(v => /natural|online|neural/i.test(v.name));
  if (natural) return natural;
  const pref = ['xiaoxiao', 'yunxi', 'yunyang', 'xiaoyi', 'huihui', 'yaoyao', 'tingting', 'meijia'];
  for (const n of pref) {
    const hit = zh.find(v => v.name.toLowerCase().replace(/[\s_-]/g, '').includes(n));
    if (hit) return hit;
  }
  return zh.find(v => v.lang.toLowerCase().includes('zh-cn')) || zh[0];
}

function speakViaWebSpeech(cleaned, session) {
  if (!state.synth) return;
  const sentences = splitSentences(cleaned);
  if (!sentences.length) return;
  const voice = pickZhVoice();
  const next = (i) => {
    if (session !== ttsSession || i >= sentences.length) return;
    const s = sentences[i];
    const u = new SpeechSynthesisUtterance(s);
    u.lang = 'zh-CN';
    u.rate = 0.92 + Math.random() * 0.08;
    u.pitch = /[？?]$/.test(s) ? 1.12 : 1.0 + (Math.random() - 0.5) * 0.06;
    if (voice) u.voice = voice;
    u.onend = () => setTimeout(() => next(i + 1), s.length <= 8 ? 180 : 280);
    u.onerror = () => next(i + 1);
    state.synth.speak(u);
  };
  next(0);
}

/* ═════════════════════════════════════════════
   Speech Recognition
   ═════════════════════════════════════════════ */
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    console.warn('Speech recognition not supported');
    return null;
  }
  const rec = new SpeechRecognition();
  rec.lang = 'zh-CN';
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  
  rec.onstart = () => {
    state.isListening = true;
    voiceCapture.classList.add('listening');
    micBtn.classList.add('active');
    voiceHint.classList.add('show');
  };
  
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    textInput.value = text;
    handleUserInput(text);
  };
  
  rec.onerror = () => {
    state.isListening = false;
    voiceCapture.classList.remove('listening');
    micBtn.classList.remove('active');
    voiceHint.classList.remove('show');
  };
  
  rec.onend = () => {
    state.isListening = false;
    voiceCapture.classList.remove('listening');
    micBtn.classList.remove('active');
    voiceHint.classList.remove('show');
  };
  
  return rec;
}

function startListening() {
  if (!state.recognition) {
    state.recognition = initRecognition();
  }
  if (state.recognition) {
    stopSpeaking();
    try {
      state.recognition.start();
    } catch (e) {
      console.log(e);
    }
  } else {
    handleUserInput(textInput.value || '');
  }
}

function stopListening() {
  if (state.recognition) {
    try { state.recognition.stop(); } catch (e) {}
  }
}

micBtn.addEventListener('click', () => {
  if (state.isListening) {
    stopListening();
  } else {
    startListening();
  }
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && textInput.value.trim()) {
    handleUserInput(textInput.value.trim());
    textInput.value = '';
  }
});

function startAssessment() {
  const welcome = document.getElementById('welcome');
  welcome.classList.add('hidden');
  
  state.assessmentDone = false;
  state.currentQuestionIndex = 0;
  state.answers = {};
  state.currentDayIndex = 0;
  
  setTimeout(() => askQuestion(), 600);
}

function askQuestion() {
  if (state.currentQuestionIndex >= questions.length) {
    finishAssessment();
    return;
  }
  
  const q = questions[state.currentQuestionIndex];
  addMessage('bot', q.text, { chips: q.options });
  speakText(q.text);
}

function handleUserInput(text) {
  const trimmed = text.trim();
  if (!trimmed) return;
  
  addMessage('user', trimmed);
  processResponse(trimmed);
}

function handleChipClick(chipText) {
  addMessage('user', chipText);
  processResponse(chipText);
}

function processResponse(response) {
  if (state.generatingPlan) return;
  
  const currentQ = questions[state.currentQuestionIndex];
  if (!currentQ || state.assessmentDone) {
    handleFreeChat(response);
    return;
  }
  
  const matchedOption = matchOption(response, currentQ.options);
  state.answers[currentQ.id] = matchedOption || response;
  
  addTyping();
  
  setTimeout(() => {
    removeTyping();
    state.currentQuestionIndex++;
    askQuestion();
  }, 800 + Math.random() * 600);
}

function matchOption(text, options) {
  const normalized = text.toLowerCase();
  for (const opt of options) {
    if (text.includes(opt) || opt.includes(text) || 
        text.length > 0 && opt.split('').every(c => text.includes(c))) {
      return opt;
    }
  }
  const keywords = {
    '是': 0, '有': 0, '服药': 0, '用药': 0, '吃': 0,
    '否': 2, '没有': 2, '不吃': 2, '不服': 2,
    '偶尔': 1,
    '记不清': 3, '不清楚': 3, '不知道': 3,
    '正常': 0, '偏低': 0,
    '偏高': 1,
    '较高': 2, '高': 2,
    '清淡': 0, '低盐': 0,
    '偏重': 2, '口味': 2, '重': 2,
    '适中': 1, '一般': 1,
    '从不': 0, '不运动': 0,
    '1次': 1, '一': 1, '次': 1,
    '3次': 2, '经常': 2,
    '每天': 3, '天天': 3,
    '很好': 0, '不错': 0,
    '一般': 1, '偶尔': 1,
    '失眠': 2, '不好': 2, '差': 2,
    '严重': 3, '很差': 3
  };
  for (const [kw, idx] of Object.entries(keywords)) {
    if (normalized.includes(kw) && options[idx]) return options[idx];
  }
  return text;
}

function generateAssessmentSummary() {
  const a = state.answers;
  const bpLevel = getBpLevel(a.bp_range);
  const riskLevel = assessRisk(a);
  
  let intro = `好的，我已经完成了您的初步健康评估。`;
  
  if (riskLevel === 'high') {
    intro += `需要提醒您：根据您目前的血压情况和生活习惯，存在一定的健康风险，建议您尽快就医并严格遵医嘱。`;
  } else if (riskLevel === 'medium') {
    intro += `您的血压情况需要关注，但通过科学管理是可以有效控制的。`;
  } else {
    intro += `您的基础情况不错，继续保持良好习惯即可。`;
  }
  
  intro += `现在让我为您分享一些高血压防治的核心知识。`;
  
  const knowledge = `📚 核心要点：\n\n• 我国成人高血压患病率约27.5%，有效控压可显著降低并发症风险\n• 建议目标血压 <140/90 mmHg\n• DASH饮食原则：低盐(<5g/天)、高钾、低脂\n• 每周3-5次中等强度有氧运动\n• 保持心理健康和充足睡眠`;
  
  const planIntro = `接下来，我将根据您的评估结果，为您生成一份未来3天的个性化健康管理方案，包含用药提醒、血压监测、营养饮食、运动建议、心理调适、睡眠冥想等内容。`;
  
  return { intro, knowledge, planIntro };
}

function getBpLevel(bpAnswer) {
  if (!bpAnswer) return 'unknown';
  if (bpAnswer.includes('偏低') || bpAnswer.includes('正常')) return 'normal';
  if (bpAnswer.includes('偏高') || bpAnswer.includes('140')) return 'high';
  if (bpAnswer.includes('较高')) return 'very_high';
  return 'unknown';
}

function assessRisk(answers) {
  let score = 0;
  const bp = answers.bp_range || '';
  if (bp.includes('较高')) score += 3;
  else if (bp.includes('偏高')) score += 2;
  else if (bp.includes('不清楚')) score += 1;
  
  const med = answers.medication || '';
  if (med.includes('没有') || med.includes('偶尔')) score += 2;
  
  const salt = answers.salt_intake || '';
  if (salt.includes('偏重')) score += 2;
  else if (salt.includes('适中') || salt.includes('不太注意')) score += 1;
  
  const ex = answers.exercise || '';
  if (ex.includes('从不')) score += 2;
  else if (ex.includes('1-2')) score += 1;
  
  const sleep = answers.sleep || '';
  if (sleep.includes('严重') || sleep.includes('经常')) score += 2;
  else if (sleep.includes('偶尔')) score += 1;
  
  if (score >= 6) return 'high';
  if (score >= 3) return 'medium';
  return 'low';
}

      card.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      card.querySelector('#timelineBody').innerHTML = renderDayItems(day);
      const items = card.querySelectorAll('.tl-item');
      items.forEach((item, i) => {
        item.style.animationDelay = (i * 0.04) + 's';
        item.style.animation = 'none';
        item.offsetHeight;
        item.style.animation = '';
      });
    });
  });
  
  scrollToBottom();
}

function renderDayItems(dayIndex) {
  const items = timelineData[dayIndex] || [];
  return items.map((item, i) => `
    <div class="tl-item ${item.cat}" style="animation-delay: ${i * 0.04}s">
      <div class="tl-time-col">
        <div class="tl-time">${item.time}</div>
        <div class="tl-dot"></div>
        <div class="tl-line"></div>
      </div>
      <div class="tl-content">
        <div class="tl-title-row">
          <div class="tl-icon">${item.icon}</div>
          <div class="tl-title">${item.title}</div>
        </div>
        <div class="tl-desc">${item.desc}</div>
        <span class="tl-tag">${item.tag}</span>
      </div>
    </div>
  `).join('');
}

function handleFreeChat(response) {
  const lower = response.toLowerCase();
  
  if (response.includes('用药') || response.includes('药')) {
    respondWithMedication(response);
  } else if (response.includes('饮食') || response.includes('吃') || response.includes('营养')) {
    respondWithNutrition(response);
  } else if (response.includes('运动') || response.includes('锻炼')) {
    respondWithExercise(response);
  } else if (response.includes('心理') || response.includes('压力') || response.includes('焦虑')) {
    respondWithPsychology(response);
  } else if (response.includes('睡眠') || response.includes('失眠') || response.includes('冥想')) {
    respondWithSleep(response);
  } else if (response.includes('血压') || response.includes('监测') || response.includes('测量')) {
    respondWithMonitoring(response);
  } else if (response.includes('康复') || response.includes('评估')) {
    respondWithAssessment(response);
  } else {
    respondGeneral(response);
  }
}

function resetChat() {
  stopSpeaking();
  chatArea.innerHTML = '';
  state.assessmentDone = false;

  const welcome = document.getElementById('welcome');

}

if (state.synth) {
